<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My_ZCode</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-brand {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <img src="/brand-icon.png" class="startup-brand" alt="" />
    </div>
    <script type="module">
      const startupLoading = document.getElementById("loading");
      let finished = false;
      let reactReady = false;

      const tryFinishStartup = () => {
        if (finished || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 300);
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartup();
      };

      window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      // React 入口静态加载;3s 兜底防止 ready 事件丢失导致启动画面卡住。
      window.setTimeout(markReactReady, 3000);
    </script></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
